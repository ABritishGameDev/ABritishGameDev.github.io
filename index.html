<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* UE5 Graph Background */
        body {
            background-color: #1A1C1E;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 24px 24px;
            color: #E2E8F0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        /* UE5 Node Styling */
        .ue-node {
            background: rgba(21, 23, 25, 0.95);
            backdrop-filter: blur(8px);
            border: 1.5px solid #2D3035;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            transition: all 0.2s ease;
        }
        .ue-node:hover {
            border-color: #D37B24; /* UE Orange selection color */
            box-shadow: 0 0 15px rgba(211, 123, 36, 0.3);
        }
        
        /* UE Node Headers (Red = Event, Blue = Function, Green = Pure) */
        .ue-header-event {
            background: linear-gradient(180deg, rgba(144, 20, 20, 0.9) 0%, rgba(90, 10, 10, 0.9) 100%);
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            border-bottom: 1px solid #111;
        }
        .ue-header-func {
            background: linear-gradient(180deg, rgba(40, 80, 150, 0.9) 0%, rgba(20, 40, 90, 0.9) 100%);
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            border-bottom: 1px solid #111;
        }
        .ue-header-macro {
            background: linear-gradient(180deg, rgba(120, 120, 120, 0.9) 0%, rgba(80, 80, 80, 0.9) 100%);
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            border-bottom: 1px solid #111;
        }

        /* UE Pins */
        .ue-pin {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #000;
            display: inline-block;
            margin-right: 8px;
        }
        .pin-exec { background: #FFFFFF; border-radius: 2px; height: 14px; width: 12px; clip-path: polygon(0% 0%, 65% 0%, 100% 50%, 65% 100%, 0% 100%); border: none;}
        .pin-obj { background: #00A8FF; } /* Blue Object */
        .pin-bool { background: #900000; } /* Red Boolean */
        .pin-int { background: #1FE5A0; } /* Cyan Int */
    </style>
</head>
